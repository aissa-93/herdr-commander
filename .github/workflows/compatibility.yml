name: Compatibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python mod tests
        run: python -m unittest discover -s tests -v
      - name: Usage tests
        run: python test_usage.py
      - name: JavaScript mod tests
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Parse Windows installer without running it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref] $tokens, [ref] $errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test Windows installer in a temporary config
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\install.Tests.ps1

  # Installs update themselves from the release branch (mods/cmdr-menubar/update.js).
  # It moves to main only once main's tests pass, and only to main's newest commit.
  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release to this commit
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since $GITHUB_SHA; its own run will release it."
            exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/heads/release"
