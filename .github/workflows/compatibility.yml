name: Compatibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python mod tests
        run: python -m unittest discover -s tests -v
      - name: Usage tests
        run: python test_usage.py
      - name: JavaScript mod tests
        shell: bash
        run: node --test tests/*.test.mjs
      - name: Parse Windows installer without running it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref] $tokens, [ref] $errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test Windows installer in a temporary config
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\install.Tests.ps1
